<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Manajemen Transportasi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f4f4f4;
    }
    h1 {
      color: #333;
    }
    .form-container {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 8px 0 4px;
    }
    input, select, button {
      padding: 8px;
      width: 100%;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #28a745;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #218838;
    }
    .list {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .list ul {
      list-style: none;
      padding: 0;
    }
    .list li {
      margin: 6px 0;
      padding: 8px;
      background: #f9f9f9;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h1>Sistem Manajemen Transportasi</h1>

  <div class="form-container">
    <h3>Form Penyewaan Kendaraan</h3>
    <label>Nama:</label>
    <input type="text" id="nama">

    <label>Nomor Telepon:</label>
    <input type="text" id="telepon">

    <label>Jenis Kendaraan:</label>
    <select id="jenis">
      <option value="Mobil">Mobil</option>
      <option value="Motor">Motor</option>
    </select>

    <label>Merk:</label>
    <input type="text" id="merk">

    <label>Model:</label>
    <input type="text" id="model">

    <label>Tahun:</label>
    <input type="number" id="tahun">

    <button onclick="tambahPelanggan()">Sewa Kendaraan</button>
  </div>

  <div class="list">
    <h3>Daftar Pelanggan</h3>
    <ul id="daftarPelanggan"></ul>
  </div>

  <script>
    // Parent class
    class Kendaraan {
      constructor(merk, model, tahun) {
        this.merk = merk;
        this.model = model;
        this.tahun = tahun;
      }
      infoKendaraan() {
        return `${this.merk} ${this.model} (${this.tahun})`;
      }
    }

    // Mobil
    class Mobil extends Kendaraan {
      constructor(merk, model, tahun) {
        super(merk, model, tahun);
      }
      infoKendaraan() {
        return `${super.infoKendaraan()} - Mobil`;
      }
    }

    // Motor
    class Motor extends Kendaraan {
      constructor(merk, model, tahun) {
        super(merk, model, tahun);
      }
      infoKendaraan() {
        return `${super.infoKendaraan()} - Motor`;
      }
    }

    // Pelanggan
    class Pelanggan {
      constructor(nama, nomorTelepon, kendaraanDisewa) {
        this.nama = nama;
        this.nomorTelepon = nomorTelepon;
        this.kendaraanDisewa = kendaraanDisewa;
      }
      infoPelanggan() {
        return `${this.nama} (${this.nomorTelepon}) menyewa ${this.kendaraanDisewa.infoKendaraan()}`;
      }
    }

    // Sistem Transportasi
    class SistemTransportasi {
      constructor() {
        this.daftarPelanggan = [];
      }

      sewaKendaraan(pelanggan) {
        this.daftarPelanggan.push(pelanggan);
      }

      tampilkanPelanggan() {
        const daftarEl = document.getElementById("daftarPelanggan");
        daftarEl.innerHTML = "";
        this.daftarPelanggan.forEach((p) => {
          const li = document.createElement("li");
          li.textContent = p.infoPelanggan();
          daftarEl.appendChild(li);
        });
      }
    }

    // Buat instance sistem
    const sistem = new SistemTransportasi();

    // Fungsi tambah pelanggan dari input form
    function tambahPelanggan() {
      const nama = document.getElementById("nama").value;
      const telepon = document.getElementById("telepon").value;
      const jenis = document.getElementById("jenis").value;
      const merk = document.getElementById("merk").value;
      const model = document.getElementById("model").value;
      const tahun = document.getElementById("tahun").value;

      if (!nama || !telepon || !merk || !model || !tahun) {
        alert("Harap isi semua data!");
        return;
      }

      let kendaraan;
      if (jenis === "Mobil") {
        kendaraan = new Mobil(merk, model, tahun);
      } else {
        kendaraan = new Motor(merk, model, tahun);
      }

      const pelanggan = new Pelanggan(nama, telepon, kendaraan);
      sistem.sewaKendaraan(pelanggan);
      sistem.tampilkanPelanggan();

      // reset form
      document.getElementById("nama").value = "";
      document.getElementById("telepon").value = "";
      document.getElementById("merk").value = "";
      document.getElementById("model").value = "";
      document.getElementById("tahun").value = "";
    }
  </script>

</body>
</html>
