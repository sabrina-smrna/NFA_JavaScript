<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Data Pegawai</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background: #f8f9fa;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 40px 20px 30px 40px;

        justify-content: center;
    }
    h2 {
        color: #333;
        background: linear-gradient(90deg, #6a11cb, #2575fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 28px;
        margin-bottom: 40px;
    }
    table {
        width: 100%;       
        table-layout: auto; 
        border-collapse: collapse;
        background: white;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        border-radius: 12px;
        overflow: hidden;
    }
    thead {
        background: linear-gradient(90deg, #2575fc, #6a11cb);
        color: white;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: center;
        font-size: 15px;
    }
    tbody tr:hover {
        background-color: #f1f1f1;
    }
    tfoot {
        background-color: #f9f9f9;
        font-weight: bold;
        color: #444;
    }
  </style>
</head>
<body>
  <h2>Data Pegawai</h2>

  <table id="tabelPegawai">
    <thead>
      <tr>
        <th>Nama Pegawai</th>
        <th>Umur</th>
        <th>Jabatan</th>
        <th>Status</th>
        <th>Gaji Pokok</th>
        <th>Tunjangan Jabatan</th>
        <th>BPJS</th>
        <th>Tunjangan Keluarga</th>
        <th>Total Gaji</th>
      </tr>
    </thead>
    <tbody id="isiTabel">
      <!-- Data otomatis dari JS -->
    </tbody>
    <tfoot>
      <tr>
        <td colspan="9" id="totalKeseluruhan"></td>
      </tr>
    </tfoot>
  </table>

  <script>
    // Daftar pegawai
    let pegawai = [
      { nama: "Dodi Prayodi", umur: 25, jabatan: "Manajer", status: "Menikah" },
      { nama: "Rina Oktavia", umur: 27, jabatan: "Asisten Manajer", status: "Belum Menikah" },
      { nama: "Budi Santoso", umur: 23, jabatan: "Staff", status: "Menikah" }
    ];

    function formatRupiah(angka) {
      return "Rp " + angka.toLocaleString("id-ID");
    }

    let isi = "";
    let totalKeseluruhan = 0;

    pegawai.forEach(p => {
      // Tentukan Gaji Pokok
      let gapok = 0;
      if (p.jabatan === "Manajer") {
        gapok = 15000000;
      } else if (p.jabatan === "Asisten Manajer") {
        gapok = 10000000;
      } else if (p.jabatan === "Staff") {
        gapok = 5000000;
      }

      // Tunjangan Jabatan 15%
      let tunjanganJabatan = 0.15 * gapok;

      // BPJS 10%
      let bpjs = 0.10 * gapok;

      // Tunjangan Keluarga
      let tunjanganKeluarga = (p.status === "Menikah") ? 0.20 * gapok : 0;

      // Total Gaji per pegawai
      let total = gapok + tunjanganJabatan + bpjs + tunjanganKeluarga;

      // Tambah ke total keseluruhan
      totalKeseluruhan += total;

      isi += `
        <tr>
          <td>${p.nama}</td>
          <td>${p.umur} Tahun</td>
          <td>${p.jabatan}</td>
          <td>${p.status}</td>
          <td>${formatRupiah(gapok)}</td>
          <td>${formatRupiah(tunjanganJabatan)}</td>
          <td>${formatRupiah(bpjs)}</td>
          <td>${formatRupiah(tunjanganKeluarga)}</td>
          <td style="font-weight:bold; color:#2575fc;">${formatRupiah(total)}</td>
        </tr>
      `;
    });

    document.getElementById("isiTabel").innerHTML = isi;

    // Menampilkan total keseluruhan
    document.getElementById("totalKeseluruhan").innerText =
      `💰 Total Gaji Keseluruhan: ${formatRupiah(totalKeseluruhan)}`;
  </script>
</body>
</html>
